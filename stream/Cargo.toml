[package]
name = "loonaro-stream"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full", "rt"] }
anyhow = "1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes = "1.6"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
libc = "0.2"
clap = { version = "4", features = ["derive"] }
rand = "0.8"

# pure rust webrtc stack
str0m = { version = "0.6" }

# encoding
x264-sys = "0.2"

# signaling
warp = "0.3"

# zero-copy mmap
memmap2 = "0.9"
nix = { version = "0.29", features = ["process", "uio", "sched"] }

# simd colorspace
yuv = { version = "0.8", features = ["fast_mode"] }

# aligned memory + precision sleep + channels
aligned-vec = "0.6"
spin_sleep = "1"
crossbeam-channel = "0.5"

# absolute performance
arc-swap = "1.7"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
opt-level = 3
strip = true
