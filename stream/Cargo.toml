[package]
name = "loonaro-stream"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
anyhow = "1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rayon = "1.10"
bytes = "1.6"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
memmap2 = "0.9"
libc = "0.2"
clap = { version = "4", features = ["derive"] }
rand = "0.8"

# pure rust webrtc stack
str0m = { version = "0.6" }

# encoding
x264-sys = "0.2"

# signaling
warp = "0.3"
