[package]
name = "loonaro-stream"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["macros", "rt", "net", "sync", "time", "io-util", "signal", "fs"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes = "1.6"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
clap = { version = "4", features = ["derive"] }
str0m = { version = "0.6" }
x264-sys = "0.2"
warp = "0.3"
nix = { version = "0.29", features = ["process", "uio", "sched"] }
yuv = { version = "0.8", features = ["fast_mode"] }
aligned-vec = "0.6"
spin_sleep = "1"
crossbeam-channel = "0.5"
arc-swap = "1.7"

#[profile.release]
#lto = "fat"
#codegen-units = 1
#panic = "abort"
#opt-level = 3
#strip = true
