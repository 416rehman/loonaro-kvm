<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOONARO // TRANSMISSION</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&family=JetBrains+Mono:wght@300;400&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --font-display: 'Inter', -apple-system, sans-serif;
            --font-tech: 'JetBrains Mono', monospace;
            --ease-cinema: cubic-bezier(0.25, 1, 0.5, 1);
            --color-accent: #fff;
            --color-dim: rgba(255, 255, 255, 0.4);
            --color-error: #ff4444;
            --color-warn: #ffbb33;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            color: #fff;
            font-family: var(--font-display);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Ambient Background */
        .ambient-bg {
            position: absolute;
            inset: -50%;
            background: linear-gradient(120deg,
                    #000000 0%,
                    #0a0a12 40%,
                    #141420 100%);
            /* A subtle moving aurora mesh could be here, but let's keep it deep and clean */
            z-index: 0;
            opacity: 1;
        }

        /* Noise Texture for filmic grain */
        .grain-overlay {
            position: absolute;
            inset: 0;
            opacity: 0.04;
            pointer-events: none;
            z-index: 1;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Container */
        #container {
            position: relative;
            width: 100%;
            height: 100%;
            z-index: 2;
        }

        /* Video Canvas */
        #stream-canvas {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            cursor: none;
            transition: opacity 1.2s var(--ease-cinema), transform 1.2s var(--ease-cinema);
            transform: scale(1);
            opacity: 1;
        }

        /* When overlay is active, push the video back slightly */
        #container.overlay-active #stream-canvas {
            transform: scale(0.98);
            opacity: 0.2;
            filter: blur(8px) grayscale(50%);
        }

        /* OVERLAY: The central experience */
        #overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 0.8s var(--ease-cinema);
            z-index: 100;
            /* No background here, we use the canvas blur for separation */
        }

        #overlay.hidden {
            opacity: 0;
            pointer-events: none;
            transform: translateY(20px);
        }

        /* Central Widget */
        .status-widget {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        /* Organic Loader */
        .core-loader {
            position: relative;
            width: 80px;
            height: 80px;
            margin-bottom: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .core-ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .core-pulse {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 20px 5px rgba(255, 255, 255, 0.4);
            animation: pulse-core 3s infinite ease-in-out;
        }

        .core-orbit {
            position: absolute;
            inset: -10px;
            border-radius: 50%;
            border: 1px solid transparent;
            border-top-color: rgba(255, 255, 255, 0.8);
            animation: spin 3s infinite linear;
        }

        @keyframes pulse-core {

            0%,
            100% {
                transform: scale(0.8);
                opacity: 0.5;
            }

            50% {
                transform: scale(1.5);
                opacity: 1;
                box-shadow: 0 0 40px 10px rgba(255, 255, 255, 0.6);
            }
        }

        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }

        /* Typography */
        #overlay-title {
            font-family: var(--font-display);
            font-weight: 200;
            /* Thin */
            font-size: 32px;
            /* Large */
            letter-spacing: 0.2em;
            /* Spaced out */
            text-transform: uppercase;
            margin-bottom: 16px;
            background: linear-gradient(to right, #fff, rgba(255, 255, 255, 0.5));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        #overlay-desc {
            font-family: var(--font-tech);
            font-size: 11px;
            color: var(--color-dim);
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        /* Status States */
        #overlay.error .core-pulse {
            background: var(--color-error);
            box-shadow: 0 0 20px var(--color-error);
        }

        #overlay.error .core-orbit {
            border-top-color: var(--color-error);
        }

        #overlay.error #overlay-title {
            background: var(--color-error);
            -webkit-text-fill-color: transparent;
            -webkit-background-clip: text;
        }

        #overlay.warning .core-pulse {
            background: var(--color-warn);
            box-shadow: 0 0 20px var(--color-warn);
        }

        #overlay.warning .core-orbit {
            border-top-color: var(--color-warn);
        }

        /* HUD: Technical readout feel */
        .hud-corner {
            position: absolute;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            pointer-events: none;
            mix-blend-mode: exclusion;
            /* Cool effect over video */
        }

        .hud-label {
            font-family: var(--font-tech);
            font-size: 9px;
            color: rgba(255, 255, 255, 0.4);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .hud-value {
            font-family: var(--font-display);
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.05em;
        }

        #hud-tl {
            top: 0;
            left: 0;
            text-align: left;
        }

        #hud-tr {
            top: 0;
            right: 0;
            text-align: right;
        }

        #hud-bl {
            bottom: 0;
            left: 0;
            text-align: left;
        }

        #hud-br {
            bottom: 0;
            right: 0;
            text-align: right;
        }

        .status-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            background: #fff;
            border-radius: 50%;
            margin-right: 8px;
            box-shadow: 0 0 8px #fff;
        }

        /* Subtle Scanline */
        .scanline {
            width: 100%;
            height: 2px;
            background: rgba(255, 255, 255, 0.05);
            position: absolute;
            z-index: 10;
            animation: scan 6s linear infinite;
            pointer-events: none;
        }

        @keyframes scan {
            0% {
                top: -10%;
            }

            100% {
                top: 110%;
            }
        }
    </style>
</head>

<body>
    <div class="ambient-bg"></div>
    <div class="grain-overlay"></div>
    <div class="scanline"></div>

    <div id="container" class="overlay-active">

        <!-- The Core Experience -->
        <div id="overlay">
            <div class="status-widget">
                <div class="core-loader">
                    <div class="core-ring"></div>
                    <div class="core-orbit"></div>
                    <div class="core-pulse"></div>
                </div>
                <h1 id="overlay-title">SYSTEM LINK</h1>
                <p id="overlay-desc">ESTABLISHING SECURE UPLINK</p>
            </div>
        </div>

        <canvas id="stream-canvas" width="1920" height="1080"></canvas>

        <!-- Technical HUD -->
        <div id="hud-tl" class="hud-corner">
            <div class="hud-label">STATUS</div>
            <div class="hud-value" id="hud-status">
                <span class="status-dot"></span><span id="status-text">INIT</span>
            </div>
        </div>

        <div id="hud-tr" class="hud-corner">
            <div class="hud-label">FPS</div>
            <div class="hud-value" id="hud-fps">00</div>
        </div>

        <div id="hud-bl" class="hud-corner">
            <div class="hud-label">PROTOCOL</div>
            <div class="hud-value">WEBRTC // SRTP</div>
        </div>

        <div id="hud-br" class="hud-corner">
            <div class="hud-label">LATENCY</div>
            <div class="hud-value">REALTIME</div>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
